name: bothost_pro
description: BotHost Pro - استضافة وإدارة البوتات
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  flutter_slidable: ^3.1.1
  flutter_animate: ^4.5.2
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0
  http: ^1.2.2
  file_picker: ^8.0.6
  path_provider: ^2.1.4
  dartssh2: ^2.8.2
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.0
  device_info_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
